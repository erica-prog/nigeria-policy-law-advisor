services:
  # The web app (docs/17-web-app-mvp.md): FastAPI backend + static browser client.
  # Start with: docker compose up api
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data

  # Optional separate document worker. Set INLINE_WORKERS=false in .env when
  # using it, so the api service only enqueues: docker compose up api worker
  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "policy_advisor.worker"]
    volumes:
      - ./data:/app/data
    profiles: ["worker"]
