services:
  app:
    build: .
    env_file: .env
    ports: ["8501:8501"]
    volumes:
      - ./data:/app/data

  # Web MVP (docs/17-web-app-mvp.md): FastAPI backend + static browser client.
  # Start with: docker compose up api
  api:
    build: .
    env_file: .env
    command: ["uvicorn", "policy_advisor.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
