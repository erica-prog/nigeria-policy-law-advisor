[project]
name = "policy-advisor"
version = "0.1.0"
description = "RAG agent acting as a law/policy advisor over Nigerian civil procedure rules and case law"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-huggingface>=0.1",
    "langchain-chroma>=0.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "pypdf>=4.0",
    "pydantic-settings>=2.4",
    "tenacity>=8.5",
    "streamlit>=1.38",
    "anthropic>=0.40",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "python-docx>=1.2.0",
    "langchain-text-splitters>=1.1.2",
    "langdetect>=1.0.9",
    "streamlit-authenticator>=0.4.2",
    "filelock>=3.29.4",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=8.0",
    "ruff>=0.15.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
